<html lang="pt-BR">

<style>
:root{
  --paper:#EEF1E6; --block:#E1E6D5; --surface:#F8FAF3; --line:#C8CFBB;
  --ink:#1E2A3A; --ink-soft:#5A6573;
  --tomato:#C93B25; --mustard:#C98B12; --mustard-soft:#F3E2B8; --tomato-soft:#F6D8D0;
  --shadow:rgba(30,42,58,.16);
  --serif:'Young Serif',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18211E; --block:#1F2A26; --surface:#1F2925; --line:#34423C;
    --ink:#E8EDE1; --ink-soft:#9DA9A1;
    --tomato:#EE6A50; --mustard:#E9B44C; --mustard-soft:#3D3322; --tomato-soft:#43261F;
    --shadow:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#18211E; --block:#1F2A26; --surface:#1F2925; --line:#34423C;
  --ink:#E8EDE1; --ink-soft:#9DA9A1;
  --tomato:#EE6A50; --mustard:#E9B44C; --mustard-soft:#3D3322; --tomato-soft:#43261F;
  --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tomato);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none !important}

.app{display:grid;grid-template-columns:minmax(0,1fr) 450px;height:100%}

/* ---------- Mapa ---------- */
.map{position:relative;min-height:0;overflow:hidden}
#leaflet{position:absolute;inset:0;background:var(--block)}
.leaflet-container{font-family:var(--sans)}
.map.placing #leaflet{cursor:crosshair}
.brand{position:absolute;left:18px;top:14px;z-index:500;pointer-events:none}
.brand h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.6vw,44px);line-height:1;margin:0;letter-spacing:-.01em;color:var(--ink);
  background:var(--paper);padding:6px 12px 8px;border-radius:12px;box-shadow:0 2px 12px var(--shadow)}
.map-actions{position:absolute;right:16px;top:16px;z-index:500}
.placing-banner{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:600;background:var(--ink);color:var(--paper);
  border-radius:999px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:12px;font-size:14px;box-shadow:0 4px 18px var(--shadow);white-space:nowrap}
.map.placing .placing-banner{display:flex}
.map.placing .map-actions,.map.placing .brand{display:none}
.placing-banner button{background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.legend{position:absolute;left:16px;bottom:24px;z-index:500;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:12.5px;
  display:flex;gap:14px;box-shadow:0 2px 10px var(--shadow);color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.map-note{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:500;background:var(--ink);color:var(--paper);border-radius:999px;
  padding:7px 8px 7px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 10px var(--shadow);white-space:nowrap}
.map-note button{background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}

.pin-wrap{background:none;border:0}
.pin{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11px;line-height:1;transition:transform .12s}
.pin.w{background:var(--mustard)} .pin.v{background:var(--tomato)}
.pin.new{background:var(--ink)}
.pin.sel{transform:scale(1.3);border-color:var(--ink)}
.leaflet-tooltip.pin-tip{font-family:var(--serif);font-size:14px;background:var(--surface);color:var(--ink);border:0;box-shadow:0 2px 8px var(--shadow);padding:3px 9px}
.leaflet-tooltip.pin-tip::before{display:none}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)}
.leaflet-control-attribution{font-size:10.5px}

/* ---------- Botões ---------- */
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;line-height:1.1;display:inline-flex;align-items:center;gap:6px}
.btn-ink{background:var(--ink);color:var(--paper);box-shadow:0 2px 10px var(--shadow)}
.btn-ink:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-soft)}
.btn-tomato{background:var(--tomato);color:#fff}
.btn-mustard{background:var(--mustard);color:#1E1A10}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;font-size:13px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--tomato)}

/* ---------- Painel ---------- */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-left:1px solid var(--line)}
.panel-top{padding:14px 20px 0;border-bottom:1px solid var(--line)}
.who-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-soft);margin-bottom:10px}
.who-row button.me{background:none;border:0;padding:0;font-weight:600;color:var(--ink)}
.who-row button.me:hover{text-decoration:underline;text-underline-offset:2px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.search:focus,.filters select:focus{border-color:var(--ink-soft);outline:none}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.filters select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font-size:13px}
.filters select.on{border-color:var(--ink);font-weight:600}
.tabs{display:flex;gap:22px;margin-top:8px}
.tabs button{background:none;border:0;padding:10px 0 12px;font-weight:600;color:var(--ink-soft);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.panel-body{flex:1;overflow-y:auto;padding:4px 20px 28px;min-height:0}

.empty{padding:32px 2px;color:var(--ink-soft);max-width:36ch}
.empty strong{display:block;font-family:var(--serif);font-weight:400;color:var(--ink);font-size:20px;margin-bottom:6px}
.chips{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Anotações separadas como picote de comanda */
.entry{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:16px 0;border-bottom:1.5px dashed var(--line)}
.entry:last-child{border-bottom:0}
.mark{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.mark.antes{background:var(--mustard)} .mark.depois{background:var(--tomato)}
.entry-rest{background:none;border:0;padding:0;font-family:var(--serif);font-size:19px;line-height:1.25;text-align:left;color:var(--ink)}
.entry-rest:hover{text-decoration:underline;text-underline-offset:3px}
.entry-meta{font-size:13px;color:var(--ink-soft);margin-top:2px}
.entry-meta button{background:none;border:0;padding:0;font-weight:600;color:var(--ink)}
.entry-meta button:hover{text-decoration:underline;text-underline-offset:2px}
.entry-text{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.then{margin:10px 0 0;padding:8px 12px;background:var(--mustard-soft);border-radius:8px;font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.then span{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;white-space:normal}
.entry-tools{display:flex;gap:14px;margin-top:8px}
.stars{color:var(--tomato);letter-spacing:1px;font-size:16px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.rating-line{margin-top:6px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.photos button{padding:0;border:0;background:var(--block);border-radius:8px;overflow:hidden;aspect-ratio:1}
.photos img{width:100%;height:100%;object-fit:cover;display:block}

/* Detalhe do restaurante */
.back{background:none;border:0;padding:14px 0 0;color:var(--ink-soft);font-weight:500}
.back:hover{color:var(--ink)}
.rest-head h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;margin:10px 0 4px;overflow-wrap:anywhere}
.rest-sub{color:var(--ink-soft);font-size:14px}
.rest-sub b{color:var(--ink);font-weight:600}
.scores{display:flex;gap:26px;margin:18px 0}
.score b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1}
.score span{font-size:12.5px;color:var(--ink-soft)}
.score.avg b{color:var(--tomato)} .score.want b{color:var(--mustard)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;margin:22px 0 2px;background:var(--block);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;font-size:13.5px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
.foot{margin-top:24px;display:flex;gap:16px;flex-wrap:wrap}

/* Listas */
.group-title{font-family:var(--serif);font-weight:400;font-size:21px;margin:22px 0 2px;display:flex;align-items:baseline;gap:8px}
.group-title small{font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1.5px dashed var(--line);padding:12px 0}
.row:hover .row-name{text-decoration:underline;text-underline-offset:3px}
.row-name{font-family:var(--serif);font-size:17px;display:block;line-height:1.3}
.row-sub{font-size:13px;color:var(--ink-soft);display:block;overflow-wrap:anywhere}
.row .stars{font-size:14px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:16px;flex:none}
.profile-head{display:flex;align-items:center;gap:14px;margin-top:10px}
.profile-head .avatar{width:54px;height:54px;font-size:26px}
.profile-head h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0;line-height:1.1}

/* Modais */
dialog{border:0;border-radius:16px;padding:0;background:var(--paper);color:var(--ink);width:min(480px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px var(--shadow)}
dialog::backdrop{background:rgba(20,28,26,.45)}
.modal{padding:22px 22px 18px}
.modal h3{font-family:var(--serif);font-weight:400;font-size:25px;margin:0 0 2px;line-height:1.15}
.hint{color:var(--ink-soft);font-size:13.5px;margin:0 0 12px}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink-soft);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.results{margin-top:10px;max-height:300px;overflow-y:auto}
.result{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1.5px dashed var(--line);padding:10px 2px}
.result:hover b{text-decoration:underline;text-underline-offset:2px}
.result b{font-family:var(--serif);font-weight:400;font-size:16px;display:block}
.result span{font-size:12.5px;color:var(--ink-soft)}
.fine{font-size:11.5px;color:var(--ink-soft);margin-top:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.error{color:var(--tomato);font-size:13px;margin-top:8px;min-height:1em}
.star-input{display:flex;gap:2px}
.star-input button{background:none;border:0;padding:0 2px;font-size:32px;line-height:1;color:var(--line)}
.star-input button.on{color:var(--tomato)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--block)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1}
.addphoto{width:72px;height:72px;border-radius:8px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink-soft);cursor:pointer;text-align:center;padding:4px}
.addphoto:hover{border-color:var(--ink-soft)}
#lb{width:auto;max-width:calc(100vw - 24px);background:#000}
#lb img{display:block;max-width:calc(100vw - 24px);max-height:calc(100vh - 60px)}

/* Entrada */
.login{position:fixed;inset:0;z-index:2000;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:min(420px,100%)}
.login h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,8vw,68px);line-height:.95;margin:0 0 14px;letter-spacing:-.02em}
.login p{color:var(--ink-soft);margin:0 0 20px;max-width:34ch}
.login .row-in{display:flex;gap:8px}
.login input{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;font-size:16px;min-width:0}
.login input:focus{border-color:var(--ink-soft);outline:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:3000;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width: 860px){
  .app{grid-template-columns:1fr;grid-template-rows:45% 55%}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .legend{display:none}
}
@media (prefers-reduced-motion: reduce){ .toast,.pin{transition:none} }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <h1>Comilanças</h1>
    <p id="loginText">Seu diário de restaurantes em Porto Alegre. Digite seu nome para entrar. Se você já usou o app, seu histórico volta com ele.</p>
    <div class="row-in" id="loginForm">
      <input id="loginName" maxlength="30" autocomplete="nickname" placeholder="Seu nome" aria-label="Seu nome">
      <button class="btn btn-ink" id="loginBtn" type="button">Entrar</button>
    </div>
    <div class="error" id="loginErr"></div>
  </div>
</div>

<div class="app">
  <section class="map" id="map" aria-label="Mapa de Porto Alegre">
    <div id="leaflet"></div>
    <div class="brand"><h1>Comilanças</h1></div>
    <div class="map-actions"><button class="btn btn-ink" id="addBtn" type="button">+ Adicionar restaurante</button></div>
    <div class="placing-banner" role="status"><span>Clique no mapa onde fica o restaurante</span><button type="button" id="cancelPlace">Cancelar</button></div>
    <div class="legend" aria-hidden="true">
      <span><i class="dot" style="background:var(--mustard)"></i>Quero ir</span>
      <span><i class="dot" style="background:var(--tomato)"></i>Já visitado</span>
    </div>
    <div class="map-note" id="mapNote" hidden></div>
  </section>

  <section class="panel" aria-label="Diário">
    <div class="panel-top">
      <div class="who-row"><span>Você entrou como <button class="me" id="meBtn" type="button"></button></span><button class="link" id="logout" type="button">Trocar usuário</button></div>
      <input class="search" id="search" type="search" placeholder="Buscar pelo nome do lugar" aria-label="Buscar pelo nome do lugar">
      <div class="filters">
        <select id="fPerson" aria-label="De quem"></select>
        <select id="fTipo" aria-label="Tipo de lugar"></select>
        <select id="fCozinha" aria-label="Cozinha"></select>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="diario" aria-selected="true">Diário</button>
        <button role="tab" data-tab="lugares" aria-selected="false">Lugares</button>
        <button role="tab" data-tab="pessoas" aria-selected="false">Pessoas</button>
      </div>
    </div>
    <div class="panel-body" id="panel"></div>
  </section>
</div>

<dialog id="dlg"><div class="modal" id="dlgBody"></div></dialog>
<dialog id="lb"><img id="lbImg" alt=""></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= Constantes ================= */
const CFG = window.COMILANCAS_CONFIG || {};
const PORTO_ALEGRE = [-30.0346, -51.2177];
const VIEWBOX = '-51.32,-29.93,-50.99,-30.28';
const TIPOS = ['Restaurante','Lanchonete','Café','Bar','Padaria','Doceria','Sorveteria','Food truck'];
const COZINHAS = ['Brasileira','Gaúcha','Italiana','Japonesa','Chinesa','Coreana','Tailandesa','Indiana','Árabe','Mexicana','Peruana',
  'Portuguesa','Francesa','Uruguaia','Argentina','Americana','Pizza','Hambúrguer','Churrasco','Massas','Frutos do mar','Vegetariana','Vegana','Doces'];
const OSM_TIPO = {restaurant:'Restaurante', fast_food:'Lanchonete', cafe:'Café', bar:'Bar', pub:'Bar', biergarten:'Bar', bakery:'Padaria',
  confectionery:'Doceria', pastry:'Doceria', ice_cream:'Sorveteria', food_court:'Restaurante'};
const OSM_COZINHA = {brazilian:'Brasileira', regional:'Brasileira', italian:'Italiana', japanese:'Japonesa', sushi:'Japonesa', chinese:'Chinesa',
  korean:'Coreana', thai:'Tailandesa', indian:'Indiana', arab:'Árabe', lebanese:'Árabe', syrian:'Árabe', middle_eastern:'Árabe', mexican:'Mexicana',
  peruvian:'Peruana', portuguese:'Portuguesa', french:'Francesa', uruguayan:'Uruguaia', argentinian:'Argentina', american:'Americana',
  pizza:'Pizza', burger:'Hambúrguer', steak_house:'Churrasco', barbecue:'Churrasco', pasta:'Massas', seafood:'Frutos do mar',
  vegetarian:'Vegetariana', vegan:'Vegana', ice_cream:'Doces', cake:'Doces', dessert:'Doces'};
const MAX_FOTOS = 6;
const ME_KEY = 'comilancas:usuario';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt1 = v => v.toFixed(1).replace('.', ',');
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
function fmtDate(v){
  if(!v) return '';
  const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v + 'T12:00:00') : new Date(v);
  return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', {day:'numeric', month:'short', year:'numeric'}).replace('.', '');
}
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const starsHtml = n => `<span class="stars" role="img" aria-label="${n} de 5 estrelas">${'★'.repeat(n)}<i>${'★'.repeat(5 - n)}</i></span>`;

/* ================= Estado ================= */
const state = {
  me: null, users: [], restaurants: [], notes: [],
  tab: 'diario', selected: null, profile: null, detailTab: 'depois', feedKind: 'todos',
  fPerson: 'todos', fTipo: '', fCozinha: '', query: '',
  lastLoad: 0
};

/* ================= Supabase ================= */
const configured = CFG.SUPABASE_URL && CFG.SUPABASE_URL.startsWith('http') && CFG.SUPABASE_KEY && !CFG.SUPABASE_KEY.startsWith('COLE');
const sb = configured && window.supabase ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY) : null;
const photoUrl = path => sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
const ok = ({data, error}) => { if(error) throw error; return data; };

async function loadAll(){
  const [u, r, n] = await Promise.all([
    sb.from('usuarios').select('id,nome,username,criado_em'),
    sb.from('restaurantes').select('*'),
    sb.from('anotacoes').select('*').order('criado_em', {ascending:false}).limit(5000)
  ]);
  state.users = ok(u); state.restaurants = ok(r); state.notes = ok(n);
  state.lastLoad = Date.now();
}
async function refresh(){
  try{ await loadAll(); render(); }catch(e){ toast('Não foi possível atualizar os dados. Verifique a conexão.'); }
}
function errMsg(e){
  if(e && /Failed to fetch|NetworkError/i.test(e.message || '')) return 'Sem conexão com o servidor. Tente de novo.';
  return 'Algo deu errado ao salvar. Tente de novo.';
}

/* ================= Dados derivados ================= */
const restById = id => state.restaurants.find(r => r.id === id);
const userById = id => state.users.find(u => u.id === id);
const nameOf = id => id === (state.me && state.me.id) ? 'Você' : ((userById(id) || {}).nome || 'Alguém');
const notesFor = rid => state.notes.filter(n => n.restaurante_id === rid);
const byNewest = (a, b) => String(b.criado_em).localeCompare(String(a.criado_em));
const antesOf = (rid, uid) => state.notes.find(n => n.restaurante_id === rid && n.tipo === 'antes' && n.usuario_id === uid);

function statsFor(rid){
  const ns = notesFor(rid), dep = ns.filter(n => n.tipo === 'depois');
  const went = new Set(dep.map(n => n.usuario_id));
  return {
    visits: dep.length,
    avg: dep.length ? dep.reduce((s, n) => s + n.nota, 0) / dep.length : null,
    want: new Set(ns.filter(n => n.tipo === 'antes' && !went.has(n.usuario_id)).map(n => n.usuario_id)).size
  };
}
// Situação de um lugar: geral, ou do ponto de vista de uma pessoa
function statusFor(rid, uid){
  if(uid){
    const mine = state.notes.filter(n => n.restaurante_id === rid && n.usuario_id === uid && n.tipo === 'depois').sort(byNewest);
    return mine.length ? {visited:true, label:String(mine[0].nota)} : {visited:false, label:''};
  }
  const s = statsFor(rid);
  return s.visits ? {visited:true, label:fmt1(s.avg)} : {visited:false, label:''};
}
function involved(r, uid){ return r.criado_por === uid || state.notes.some(n => n.restaurante_id === r.id && n.usuario_id === uid); }
function personFilterId(){ return state.fPerson === 'todos' ? null : state.fPerson; }
function visibleRestaurants(){
  const pid = personFilterId(), q = norm(state.query);
  return state.restaurants.filter(r =>
    (!pid || involved(r, pid)) &&
    (!state.fTipo || r.tipo === state.fTipo) &&
    (!state.fCozinha || r.cozinha === state.fCozinha) &&
    (!q || norm(r.nome).includes(q)));
}

/* ================= Mapa ================= */
const mapEl = $('#map');
const map = L.map('leaflet', {zoomControl:false}).setView(PORTO_ALEGRE, 13);
L.control.zoom({position:'bottomright'}).addTo(map);
// Mapas do OpenStreetMap: gratuitos e sem chave. No modo escuro, as cores são invertidas.
const OSM_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
document.head.insertAdjacentHTML('beforeend', '<style>.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}</style>');
const tiles = {
  light: L.tileLayer(OSM_URL, {maxZoom:19, attribution:OSM_ATTR}),
  dark: L.tileLayer(OSM_URL, {maxZoom:19, attribution:OSM_ATTR, className:'tiles-dark'})
};
const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
let currentTiles = null;
function setTiles(){
  const t = document.documentElement.dataset.theme;
  const dark = t ? t === 'dark' : darkMq.matches;
  const next = dark ? tiles.dark : tiles.light;
  if(next === currentTiles) return;
  if(currentTiles) map.removeLayer(currentTiles);
  currentTiles = next.addTo(map);
}
setTiles();
darkMq.addEventListener && darkMq.addEventListener('change', setTiles);

const pinLayer = L.layerGroup().addTo(map);
let tempMarker = null;
function pinIcon(cls, label){
  return L.divIcon({className:'pin-wrap', html:`<div class="pin ${cls}">${esc(label)}</div>`, iconSize:[34,34], iconAnchor:[17,17]});
}
function drawPins(){
  pinLayer.clearLayers();
  const pid = personFilterId();
  visibleRestaurants().forEach(r => {
    const st = statusFor(r.id, pid);
    const sel = r.id === state.selected;
    const m = L.marker([r.lat, r.lng], {icon: pinIcon((st.visited ? 'v' : 'w') + (sel ? ' sel' : ''), st.label), zIndexOffset: sel ? 1000 : 0, title: r.nome, keyboard: true});
    m.bindTooltip(r.nome, {direction:'top', offset:[0,-16], className:'pin-tip'});
    m.on('click', () => openRestaurant(r.id, false));
    m.addTo(pinLayer);
  });
  const note = $('#mapNote');
  const active = [];
  if(pid) active.push(`Mapa de ${pid === state.me.id ? 'você' : esc(nameOf(pid))}`);
  if(state.fTipo) active.push(esc(state.fTipo));
  if(state.fCozinha) active.push(esc(state.fCozinha));
  if(active.length){
    note.innerHTML = `<span>${active.join(', ')}</span><button type="button" id="clearFilters">Ver todos</button>`;
    note.hidden = false;
    $('#clearFilters').onclick = () => { state.fPerson = 'todos'; state.fTipo = ''; state.fCozinha = ''; render(); };
  } else note.hidden = true;
}
function setTemp(lat, lng){
  if(tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([lat, lng], {icon: pinIcon('new', '+'), zIndexOffset: 2000}).addTo(map);
  map.flyTo([lat, lng], Math.max(map.getZoom(), 16), {duration: .6});
}
function clearTemp(){ if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; } }

/* ================= Filtros ================= */
function renderFilters(){
  const people = [...state.users].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).filter(u => u.id !== state.me.id);
  $('#fPerson').innerHTML = `<option value="todos">Todo mundo</option><option value="${esc(state.me.id)}">Só os meus</option>` +
    people.map(u => `<option value="${esc(u.id)}">De ${esc(u.nome)}</option>`).join('');
  $('#fPerson').value = state.fPerson;
  const count = key => { const m = {}; state.restaurants.forEach(r => { if(r[key]) m[r[key]] = (m[r[key]] || 0) + 1; }); return m; };
  const tc = count('tipo'), cc = count('cozinha');
  const opts = (m, all) => `<option value="">${all}</option>` + Object.keys(m).sort((a, b) => a.localeCompare(b, 'pt-BR')).map(k => `<option value="${esc(k)}">${esc(k)} (${m[k]})</option>`).join('');
  $('#fTipo').innerHTML = opts(tc, 'Qualquer tipo'); $('#fTipo').value = state.fTipo;
  $('#fCozinha').innerHTML = opts(cc, 'Toda cozinha'); $('#fCozinha').value = state.fCozinha;
  if($('#fTipo').value !== state.fTipo){ state.fTipo = ''; $('#fTipo').value = ''; }
  if($('#fCozinha').value !== state.fCozinha){ state.fCozinha = ''; $('#fCozinha').value = ''; }
  $('#fPerson').classList.toggle('on', state.fPerson !== 'todos');
  $('#fTipo').classList.toggle('on', !!state.fTipo);
  $('#fCozinha').classList.toggle('on', !!state.fCozinha);
}
$('#fPerson').onchange = e => { state.fPerson = e.target.value; state.selected = null; render(); };
$('#fTipo').onchange = e => { state.fTipo = e.target.value; state.selected = null; render(); };
$('#fCozinha').onchange = e => { state.fCozinha = e.target.value; state.selected = null; render(); };
let qTimer;
$('#search').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.query = e.target.value; state.selected = null; state.profile = null; if(state.tab === 'pessoas') state.tab = 'lugares'; render(); }, 150); });

/* ================= Painel ================= */
function photosHtml(paths){
  if(!paths || !paths.length) return '';
  return `<div class="photos">${paths.map(p => `<button type="button" data-photo="${esc(photoUrl(p))}" aria-label="Ampliar foto"><img src="${esc(photoUrl(p))}" alt="" loading="lazy"></button>`).join('')}</div>`;
}
function entry(n, showRest){
  const r = restById(n.restaurante_id);
  const mine = n.usuario_id === state.me.id;
  const person = `<button type="button" data-person="${esc(n.usuario_id)}">${esc(nameOf(n.usuario_id))}</button>`;
  let meta, body = '';
  if(n.tipo === 'antes'){
    meta = `${person} anotou uma expectativa em ${fmtDate(n.criado_em)}`;
  } else {
    meta = `${person} foi em ${fmtDate(n.data_visita) || fmtDate(n.criado_em)}`;
    body += `<div class="rating-line">${starsHtml(n.nota)}</div>`;
    const a = antesOf(n.restaurante_id, n.usuario_id);
    if(a && a.comentario) body += `<div class="then"><span>Antes de ir, esperava:</span>${esc(a.comentario)}</div>`;
  }
  if(n.comentario) body += `<p class="entry-text">${esc(n.comentario)}</p>`;
  body += photosHtml(n.fotos);
  const tools = mine ? `<div class="entry-tools">
      <button class="link" data-edit-note="${esc(n.id)}">Editar</button>
      <button class="link" data-del-note="${esc(n.id)}">Apagar</button></div>` : '';
  return `<article class="entry">
    <div class="mark ${n.tipo}" aria-hidden="true"></div>
    <div>
      ${showRest && r ? `<button class="entry-rest" data-open="${esc(r.id)}">${esc(r.nome)}</button>` : ''}
      <div class="entry-meta">${meta}</div>
      ${body}${tools}
    </div>
  </article>`;
}
function restRow(r, sub){
  const pid = personFilterId(), st = statusFor(r.id, pid), s = statsFor(r.id);
  const info = sub != null ? sub : esc([r.tipo, r.cozinha].filter(Boolean).join(', ')) + (s.avg != null ? ` · média ${fmt1(s.avg)} em ${plural(s.visits, 'visita', 'visitas')}` : '');
  return `<button class="row" data-open="${esc(r.id)}">
    <i class="mark ${st.visited ? 'depois' : 'antes'}" aria-hidden="true"></i>
    <span><span class="row-name">${esc(r.nome)}</span><span class="row-sub">${info}</span></span>
  </button>`;
}

function renderDiario(){
  const vis = new Set(visibleRestaurants().map(r => r.id));
  const pid = personFilterId();
  let ns = state.notes.filter(n => vis.has(n.restaurante_id) && (!pid || n.usuario_id === pid));
  if(state.feedKind !== 'todos') ns = ns.filter(n => n.tipo === state.feedKind);
  ns.sort(byNewest);
  if(!state.notes.length){
    return `<div class="empty"><strong>Nenhuma anotação ainda</strong>${state.restaurants.length
      ? 'Clique num restaurante do mapa e conte o que você espera dele, ou registre uma visita.'
      : 'Comece adicionando um restaurante pelo botão no mapa. Depois, anote o que espera dele antes de ir e o que achou quando voltar.'}</div>`;
  }
  const chips = `<div class="chips" role="group" aria-label="Filtrar anotações">
    ${[['todos','Tudo'],['antes','Antes de ir'],['depois','Depois de ir']].map(([k, l]) => `<button class="chip" data-kind="${k}" aria-pressed="${state.feedKind === k}">${l}</button>`).join('')}</div>`;
  return chips + (ns.length ? ns.slice(0, 200).map(n => entry(n, true)).join('') : `<div class="empty">Nenhuma anotação com esses filtros.</div>`);
}

function renderLugares(){
  const rs = visibleRestaurants();
  if(!state.restaurants.length) return `<div class="empty"><strong>O mapa está vazio</strong>Adicione o primeiro restaurante pelo botão no mapa.</div>`;
  if(!rs.length) return `<div class="empty"><strong>Nada encontrado</strong>Nenhum lugar com esses filtros${state.query ? ` e com “${esc(state.query)}” no nome` : ''}.</div>`;
  rs.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  return `<div class="chips"><span class="row-sub">${plural(rs.length, 'lugar', 'lugares')}</span></div>` + rs.map(r => restRow(r)).join('');
}

function renderPessoas(){
  const people = [...state.users].sort((a, b) => (b.id === state.me.id) - (a.id === state.me.id) || a.nome.localeCompare(b.nome, 'pt-BR'));
  return people.map(u => {
    const ns = state.notes.filter(n => n.usuario_id === u.id);
    const visits = ns.filter(n => n.tipo === 'depois').length;
    const added = state.restaurants.filter(r => r.criado_por === u.id).length;
    return `<button class="row" data-person="${esc(u.id)}">
      <span class="avatar" aria-hidden="true">${esc(u.nome.charAt(0).toUpperCase())}</span>
      <span><span class="row-name">${esc(u.id === state.me.id ? u.nome + ' (você)' : u.nome)}</span>
      <span class="row-sub">${plural(added, 'lugar adicionado', 'lugares adicionados')}, ${plural(visits, 'visita', 'visitas')}</span></span>
    </button>`;
  }).join('');
}

function renderProfile(){
  const u = userById(state.profile);
  if(!u){ state.profile = null; return renderTab(); }
  const isMe = u.id === state.me.id;
  const ns = state.notes.filter(n => n.usuario_id === u.id);
  const dep = ns.filter(n => n.tipo === 'depois').sort((a, b) => String(b.data_visita || '').localeCompare(String(a.data_visita || '')) || byNewest(a, b));
  const wentIds = new Set(dep.map(n => n.restaurante_id));
  const want = ns.filter(n => n.tipo === 'antes' && !wentIds.has(n.restaurante_id)).sort(byNewest);
  const avg = dep.length ? dep.reduce((s, n) => s + n.nota, 0) / dep.length : null;
  const added = state.restaurants.filter(r => r.criado_por === u.id).length;
  const wantHtml = want.map(n => { const r = restById(n.restaurante_id); if(!r) return '';
    const t = n.comentario ? esc(n.comentario.length > 90 ? n.comentario.slice(0, 90) + '…' : n.comentario) : esc([r.tipo, r.cozinha].filter(Boolean).join(', '));
    return restRow(r, t); }).join('');
  const depHtml = dep.map(n => { const r = restById(n.restaurante_id); if(!r) return '';
    return `<button class="row" data-open="${esc(r.id)}"><i class="mark depois" aria-hidden="true"></i>
      <span><span class="row-name">${esc(r.nome)}</span><span class="row-sub">${fmtDate(n.data_visita)}</span>${starsHtml(n.nota)}</span></button>`; }).join('');
  return `<button class="back" data-back>← Voltar</button>
    <div class="profile-head"><span class="avatar" aria-hidden="true">${esc(u.nome.charAt(0).toUpperCase())}</span>
      <div><h2>${esc(u.nome)}</h2><div class="row-sub">No Comilanças desde ${fmtDate(u.criado_em)}</div></div></div>
    <div class="scores">
      <div class="score avg"><b>${avg != null ? fmt1(avg) : '–'}</b><span>nota média dada</span></div>
      <div class="score"><b>${dep.length}</b><span>${dep.length === 1 ? 'visita' : 'visitas'}</span></div>
      <div class="score"><b>${added}</b><span>${added === 1 ? 'lugar adicionado' : 'lugares adicionados'}</span></div>
    </div>
    <div class="actions"><button class="btn btn-ghost" data-map-of="${esc(u.id)}">Ver o mapa ${isMe ? 'só com os meus' : 'de ' + esc(u.nome)}</button></div>
    <h3 class="group-title">Quer ir <small>${want.length}</small></h3>
    ${wantHtml || `<div class="empty" style="padding:8px 0">${isMe ? 'Abra um restaurante no mapa e toque em “Quero ir”.' : 'Nenhum lugar na lista.'}</div>`}
    <h3 class="group-title">Já foi <small>${plural(dep.length, 'visita', 'visitas')}</small></h3>
    ${depHtml || `<div class="empty" style="padding:8px 0">Nenhuma visita registrada.</div>`}`;
}

function renderRestaurant(){
  const r = restById(state.selected);
  if(!r){ state.selected = null; return renderTab(); }
  const st = statsFor(r.id), ns = notesFor(r.id).sort(byNewest);
  const antes = ns.filter(n => n.tipo === 'antes'), depois = ns.filter(n => n.tipo === 'depois');
  const myAntes = antesOf(r.id, state.me.id);
  const list = state.detailTab === 'antes' ? antes : depois;
  const kind = [r.tipo, r.cozinha].filter(Boolean).map(esc).join(', ');
  const isCreator = r.criado_por === state.me.id;
  const canDelete = isCreator && ns.every(n => n.usuario_id === state.me.id);
  return `<button class="back" data-back>← Voltar</button>
    <div class="rest-head">
      <h2>${esc(r.nome)}</h2>
      <div class="rest-sub">${kind ? `<b>${kind}</b><br>` : ''}${r.endereco ? esc(r.endereco) + '<br>' : ''}Adicionado por ${isCreator ? 'você' : esc(nameOf(r.criado_por))}</div>
    </div>
    <div class="scores">
      <div class="score avg"><b>${st.avg != null ? fmt1(st.avg) : '–'}</b><span>média de ${plural(st.visits, 'visita', 'visitas')}</span></div>
      <div class="score want"><b>${st.want}</b><span>${st.want === 1 ? 'pessoa quer ir' : 'pessoas querem ir'}</span></div>
    </div>
    <div class="actions">
      <button class="btn btn-mustard" data-antes="${esc(r.id)}">${myAntes ? 'Editar expectativa' : 'Quero ir'}</button>
      <button class="btn btn-tomato" data-depois="${esc(r.id)}">Registrar visita</button>
    </div>
    <div class="seg" role="group" aria-label="Anotações">
      <button data-dtab="depois" aria-pressed="${state.detailTab === 'depois'}">Depois de ir (${depois.length})</button>
      <button data-dtab="antes" aria-pressed="${state.detailTab === 'antes'}">Antes de ir (${antes.length})</button>
    </div>
    ${list.length ? list.map(n => entry(n, false)).join('') : `<div class="empty">${state.detailTab === 'antes'
      ? 'Ninguém anotou expectativas ainda. Conte o que você espera desse lugar.'
      : 'Nenhuma visita registrada. Seja a primeira pessoa a contar como foi.'}</div>`}
    <div class="foot">
      <a class="link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.nome + ' ' + (r.endereco || '') + ' Porto Alegre')}" target="_blank" rel="noopener">Abrir no Google Maps</a>
      ${isCreator ? `<button class="link" data-edit-rest="${esc(r.id)}">Editar informações</button>` : ''}
      ${canDelete ? `<button class="link" data-del-rest="${esc(r.id)}">Remover do mapa</button>` : ''}
    </div>`;
}

function renderTab(){
  if(state.tab === 'lugares') return renderLugares();
  if(state.tab === 'pessoas') return renderPessoas();
  return renderDiario();
}
function render(){
  if(!state.me) return;
  $('#meBtn').textContent = state.me.nome;
  renderFilters();
  $('#panel').innerHTML = state.selected ? renderRestaurant() : state.profile ? renderProfile() : renderTab();
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(!state.selected && !state.profile && b.dataset.tab === state.tab)));
  drawPins();
}

function openRestaurant(id, pan){
  state.selected = id; state.detailTab = 'depois';
  const r = restById(id);
  if(r && pan) map.flyTo([r.lat, r.lng], Math.max(map.getZoom(), 15), {duration:.6});
  render(); $('#panel').scrollTop = 0;
}
function openProfile(uid){ state.selected = null; state.profile = uid; render(); $('#panel').scrollTop = 0; }

$('#panel').addEventListener('click', async e => {
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.open) return openRestaurant(d.open, true);
  if(d.person) return openProfile(d.person);
  if('back' in d){ if(state.selected && state.profile){ state.selected = null; } else { state.selected = null; state.profile = null; } render(); return; }
  if(d.kind){ state.feedKind = d.kind; render(); return; }
  if(d.dtab){ state.detailTab = d.dtab; render(); return; }
  if(d.mapOf){ state.fPerson = d.mapOf; render(); return; }
  if(d.photo){ $('#lbImg').src = d.photo; $('#lb').showModal(); return; }
  if(d.antes) return openAntes(d.antes);
  if(d.depois) return openDepois(d.depois);
  if(d.editNote){ const n = state.notes.find(x => x.id === d.editNote); if(n) (n.tipo === 'antes' ? openAntes(n.restaurante_id) : openDepois(n.restaurante_id, n.id)); return; }
  if(d.editRest) return openRestaurantForm({mode:'edit', r: restById(d.editRest)});
  if(d.delNote){
    const n = state.notes.find(x => x.id === d.delNote);
    if(!n || !confirm('Apagar esta anotação?')) return;
    try{
      ok(await sb.from('anotacoes').delete().eq('id', n.id));
      if(n.fotos && n.fotos.length) await sb.storage.from('fotos').remove(n.fotos);
      toast('Anotação apagada'); await refresh();
    }catch(err){ toast(errMsg(err)); }
    return;
  }
  if(d.delRest){
    const r = restById(d.delRest);
    if(!r || !confirm(`Remover “${r.nome}” do mapa? Suas anotações sobre ele também serão apagadas.`)) return;
    try{
      const fotos = notesFor(r.id).flatMap(n => n.fotos || []);
      ok(await sb.from('restaurantes').delete().eq('id', r.id));
      if(fotos.length) await sb.storage.from('fotos').remove(fotos);
      state.selected = null; toast('Restaurante removido'); await refresh();
    }catch(err){ toast(errMsg(err)); }
  }
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.selected = null; state.profile = null; render(); });

/* ================= Modais ================= */
const dlg = $('#dlg'), dlgBody = $('#dlgBody');
function openModal(html){ dlgBody.innerHTML = html; if(!dlg.open) dlg.showModal(); }
function closeModal(){ if(dlg.open) dlg.close(); }
dlg.addEventListener('close', clearTemp);
dlg.addEventListener('click', e => { if(e.target === dlg) closeModal(); });

/* ---- Adicionar restaurante: busca ---- */
async function nominatim(path){
  const res = await fetch('https://nominatim.openstreetmap.org/' + path, {headers:{'Accept-Language':'pt-BR'}});
  if(!res.ok) throw new Error('busca');
  return res.json();
}
function fmtAddress(a){
  if(!a) return '';
  const street = [a.road || a.pedestrian, a.house_number].filter(Boolean).join(', ');
  return [street, a.suburb || a.neighbourhood || a.city_district].filter(Boolean).join(', ');
}
function fromOsm(item){
  const ex = item.extratags || {};
  const cz = String(ex.cuisine || '').split(';').map(s => OSM_COZINHA[s.trim()]).find(Boolean) || '';
  return {
    nome: item.name || (item.display_name || '').split(',')[0],
    endereco: fmtAddress(item.address),
    lat: +item.lat, lng: +item.lon,
    tipo: OSM_TIPO[item.type] || '',
    cozinha: cz,
    osm_id: item.osm_type && item.osm_id ? item.osm_type.charAt(0) + item.osm_id : null
  };
}

function openSearch(prefill){
  openModal(`
    <h3>Adicionar restaurante</h3>
    <p class="hint">Busque pelo nome ou pelo endereço em Porto Alegre.</p>
    <div class="searchbar">
      <input id="sQ" placeholder="Ex.: Café do Mercado ou Rua Padre Chagas" aria-label="Nome ou endereço" value="${esc(prefill || '')}">
      <button class="btn btn-ink" id="sGo" type="button">Buscar</button>
    </div>
    <div class="results" id="sRes"></div>
    <div class="modal-actions" style="justify-content:space-between;align-items:center">
      <button class="link" id="sPlace" type="button">Não encontrou? Marque no mapa</button>
      <button class="btn btn-ghost" id="sCancel" type="button">Cancelar</button>
    </div>
    <p class="fine">Busca de endereços pelo OpenStreetMap.</p>`);
  const input = $('#sQ'); input.focus();
  const go = async () => {
    const q = input.value.trim(); if(q.length < 3){ $('#sRes').innerHTML = `<p class="hint">Digite pelo menos 3 letras.</p>`; return; }
    $('#sRes').innerHTML = `<p class="hint">Buscando…</p>`;
    try{
      const data = await nominatim(`search?format=jsonv2&addressdetails=1&extratags=1&limit=8&countrycodes=br&bounded=1&viewbox=${VIEWBOX}&q=${encodeURIComponent(q)}`);
      if(!data.length){ $('#sRes').innerHTML = `<p class="hint">Nada encontrado com “${esc(q)}”. Tente outro nome, o endereço, ou marque o lugar direto no mapa.</p>`; return; }
      const items = data.map(fromOsm);
      $('#sRes').innerHTML = items.map((it, i) => `<button class="result" data-i="${i}"><b>${esc(it.nome)}</b><span>${esc([it.tipo, it.endereco].filter(Boolean).join(', ') || 'Porto Alegre')}</span></button>`).join('');
      $('#sRes').querySelectorAll('.result').forEach(b => b.onclick = () => {
        const it = items[+b.dataset.i];
        const dup = it.osm_id && state.restaurants.find(r => r.osm_id === it.osm_id);
        if(dup){ closeModal(); toast('Esse lugar já está no mapa'); openRestaurant(dup.id, true); return; }
        setTemp(it.lat, it.lng);
        openRestaurantForm({mode:'new', r: it});
      });
    }catch(err){ $('#sRes').innerHTML = `<p class="hint">A busca não respondeu. Espere alguns segundos e tente de novo.</p>`; }
  };
  $('#sGo').onclick = go;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  $('#sCancel').onclick = closeModal;
  $('#sPlace').onclick = () => { closeModal(); startPlacing(); };
}

/* ---- Marcar no mapa (plano B) ---- */
function startPlacing(){
  mapEl.classList.add('placing');
  map.once('click', async e => {
    stopPlacing();
    const {lat, lng} = e.latlng;
    setTemp(lat, lng);
    let endereco = '';
    try{ const d = await nominatim(`reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${lat}&lon=${lng}`); endereco = fmtAddress(d.address); }catch(err){}
    openRestaurantForm({mode:'new', r:{nome:'', endereco, lat, lng, tipo:'', cozinha:'', osm_id:null}});
  });
}
function stopPlacing(){ mapEl.classList.remove('placing'); map.off('click'); }
$('#cancelPlace').onclick = stopPlacing;
document.addEventListener('keydown', e => { if(e.key === 'Escape' && mapEl.classList.contains('placing')) stopPlacing(); });
$('#addBtn').onclick = () => openSearch();

/* ---- Formulário do restaurante ---- */
function openRestaurantForm({mode, r}){
  const isNew = mode === 'new';
  openModal(`
    <h3>${isNew ? 'Novo restaurante' : 'Editar informações'}</h3>
    <p class="hint">${isNew ? 'Confira os dados. O pino escuro no mapa mostra onde ele vai ficar.' : esc(r.nome)}</p>
    <label class="field"><span>Nome</span><input id="rNome" maxlength="80" value="${esc(r.nome)}"></label>
    <label class="field"><span>Endereço</span><input id="rEnd" maxlength="140" value="${esc(r.endereco || '')}" placeholder="Opcional"></label>
    <div class="two">
      <label class="field"><span>Tipo de lugar</span>
        <select id="rTipo"><option value="">Escolha</option>${TIPOS.map(t => `<option ${t === r.tipo ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="field"><span>Cozinha</span><input id="rCoz" list="cozList" maxlength="40" value="${esc(r.cozinha || '')}" placeholder="Ex.: Italiana"></label>
    </div>
    <datalist id="cozList">${[...new Set([...COZINHAS, ...state.restaurants.map(x => x.cozinha).filter(Boolean)])].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="error" id="rErr"></div>
    <div class="modal-actions">
      ${isNew ? `<button class="btn btn-ghost" id="rBack" type="button">Voltar à busca</button>` : `<button class="btn btn-ghost" id="rCancel" type="button">Cancelar</button>`}
      <button class="btn btn-ink" id="rSave" type="button">${isNew ? 'Salvar restaurante' : 'Salvar alterações'}</button>
    </div>`);
  if(isNew) $('#rBack').onclick = () => { clearTemp(); openSearch(r.nome); };
  else $('#rCancel').onclick = closeModal;
  $('#rNome').focus();
  $('#rSave').onclick = async () => {
    const nome = $('#rNome').value.trim();
    if(!nome){ $('#rErr').textContent = 'Dê um nome ao restaurante.'; $('#rNome').focus(); return; }
    const cozRaw = $('#rCoz').value.trim();
    const coz = COZINHAS.find(c => norm(c) === norm(cozRaw)) || state.restaurants.map(x => x.cozinha).find(c => c && norm(c) === norm(cozRaw)) || cozRaw;
    const row = { nome, endereco: $('#rEnd').value.trim() || null, tipo: $('#rTipo').value || null, cozinha: coz || null };
    $('#rSave').disabled = true;
    try{
      let id = r.id;
      if(isNew){
        const created = ok(await sb.from('restaurantes').insert(Object.assign(row, {lat: r.lat, lng: r.lng, osm_id: r.osm_id, criado_por: state.me.id})).select().single());
        id = created.id;
      } else ok(await sb.from('restaurantes').update(row).eq('id', r.id));
      closeModal(); toast(isNew ? 'Restaurante adicionado' : 'Informações salvas');
      await refresh(); state.profile = null; openRestaurant(id, false);
      if(isNew){ state.detailTab = 'antes'; render(); }
    }catch(err){
      $('#rSave').disabled = false;
      $('#rErr').textContent = err && err.code === '23505' ? 'Esse lugar já foi adicionado por alguém. Feche e procure por ele no mapa.' : errMsg(err);
    }
  };
}

/* ---- Antes de ir ---- */
function openAntes(rid){
  const r = restById(rid); if(!r) return;
  const ex = antesOf(rid, state.me.id);
  openModal(`
    <h3>Antes de ir</h3>
    <p class="hint">${esc(r.nome)}: o que você espera desse lugar?</p>
    <label class="field"><span>Sua expectativa</span><textarea id="aText" maxlength="1500" placeholder="Quem indicou, o que ouviu falar, o que quer provar…">${esc(ex ? ex.comentario : '')}</textarea></label>
    <div class="error" id="aErr"></div>
    <div class="modal-actions">

    </div>`);

/* ---- Depois de ir (com fotos) ---- */
async function compress(file){
  let src;
  try{ src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  }
  const w = src.width, h = src.height, s = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('foto')), 'image/jpeg', 0.82));
}

function openDepois(rid, noteId){
  const r = restById(rid); if(!r) return;
  const editing = noteId ? state.notes.find(n => n.id === noteId) : null;
  const ex = antesOf(rid, state.me.id);
  let rating = editing ? editing.nota : 0;
  let keep = editing ? [...(editing.fotos || [])] : [];
  const removed = [];
  let adds = [];
  openModal(`
    <h3>${editing ? 'Editar visita' : 'Registrar visita'}</h3>
    <p class="hint">${esc(r.nome)}</p>
    ${ex && ex.comentario ? `<div class="then" style="margin:0 0 4px"><span>Sua expectativa antes de ir:</span>${esc(ex.comentario)}</div>` : ''}
    <div class="field"><span>Nota</span>
      <div class="star-input" id="stars" role="radiogroup" aria-label="Nota">
        ${[1,2,3,4,5].map(i => `<button type="button" role="radio" data-v="${i}" aria-label="${plural(i, 'estrela', 'estrelas')}">★</button>`).join('')}
      </div></div>
    <label class="field"><span>Quando você foi</span><input id="dDate" type="date" max="${todayStr()}" value="${esc(editing ? editing.data_visita : todayStr())}"></label>
    <label class="field"><span>Como foi?</span><textarea id="dText" maxlength="3000" placeholder="${ex ? 'Correspondeu ao que você esperava?' : 'Comida, atendimento, ambiente, o que pediria de novo…'}">${esc(editing ? editing.comentario || '' : '')}</textarea></label>
    <div class="field"><span>Fotos</span>
      <div class="thumbs" id="thumbs"></div>
      <input id="dFiles" type="file" accept="image/*" multiple hidden>
    </div>
    <div class="error" id="dErr"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dCancel" type="button">Cancelar</button>
      <button class="btn btn-tomato" id="dSave" type="button">${editing ? 'Salvar visita' : 'Registrar visita'}</button>
    </div>`);

  const starBtns = [...document.querySelectorAll('#stars button')];
  const paint = v => starBtns.forEach(b => { b.classList.toggle('on', +b.dataset.v <= v); b.setAttribute('aria-checked', String(+b.dataset.v === rating)); });
  starBtns.forEach(b => {
    b.onclick = () => { rating = +b.dataset.v; paint(rating); };
    b.onmouseenter = () => paint(+b.dataset.v);
    b.onmouseleave = () => paint(rating);
  });
  paint(rating);

  const drawThumbs = () => {
    const total = keep.length + adds.length;
    $('#thumbs').innerHTML =
      keep.map((p, i) => `<div class="thumb"><img src="${esc(photoUrl(p))}" alt=""><button type="button" data-rk="${i}" aria-label="Remover foto">×</button></div>`).join('') +
      adds.map((a, i) => `<div class="thumb"><img src="${a.url}" alt=""><button type="button" data-ra="${i}" aria-label="Remover foto">×</button></div>`).join('') +
      (total < MAX_FOTOS ? `<label class="addphoto" for="dFiles">+ Adicionar fotos</label>` : '');
    $('#thumbs').querySelectorAll('[data-rk]').forEach(b => b.onclick = () => { removed.push(...keep.splice(+b.dataset.rk, 1)); drawThumbs(); });
    $('#thumbs').querySelectorAll('[data-ra]').forEach(b => b.onclick = () => { const [a] = adds.splice(+b.dataset.ra, 1); URL.revokeObjectURL(a.url); drawThumbs(); });
  };
  drawThumbs();
  $('#dFiles').onchange = e => {
    const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
    const room = MAX_FOTOS - keep.length - adds.length;
    if(files.length > room) toast(`Cabem até ${MAX_FOTOS} fotos por visita.`);
    files.slice(0, room).forEach(f => adds.push({file: f, url: URL.createObjectURL(f)}));
    e.target.value = ''; drawThumbs();
  };
  $('#dCancel').onclick = () => { adds.forEach(a => URL.revokeObjectURL(a.url)); closeModal(); };
  $('#dSave').onclick = async () => {
    if(!rating){ $('#dErr').textContent = 'Toque nas estrelas para dar uma nota.'; starBtns[0].focus(); return; }
    const btn = $('#dSave'); btn.disabled = true;
    const uploaded = [];
    try{
      for(let i = 0; i < adds.length; i++){
        btn.textContent = `Enviando foto ${i + 1} de ${adds.length}…`;
        let blob;
        try{ blob = await compress(adds[i].file); }
        catch(e){ throw {friendly: 'Uma das fotos está num formato que o navegador não abre. Tente em JPG ou PNG.'}; }
        const path = `${state.me.id}/${newId()}.jpg`;
        ok(await sb.storage.from('fotos').upload(path, blob, {contentType: 'image/jpeg'}));
        uploaded.push(path);
      }
      btn.textContent = 'Salvando…';
      const row = { nota: rating, comentario: $('#dText').value.trim() || null, data_visita: $('#dDate').value || todayStr(), fotos: [...keep, ...uploaded] };
      if(editing) ok(await sb.from('anotacoes').update(row).eq('id', editing.id));
      else ok(await sb.from('anotacoes').insert(Object.assign(row, {restaurante_id: rid, usuario_id: state.me.id, tipo: 'depois'})));
      if(removed.length) await sb.storage.from('fotos').remove(removed);
      adds.forEach(a => URL.revokeObjectURL(a.url));
      closeModal(); toast(editing ? 'Visita atualizada' : 'Visita registrada'); state.detailTab = 'depois'; await refresh();
    }catch(err){
      if(uploaded.length) sb.storage.from('fotos').remove(uploaded).catch(() => {});
      $('#dErr').textContent = (err && err.friendly) || errMsg(err);
      btn.disabled = false; btn.textContent = editing ? 'Salvar visita' : 'Registrar visita';
    }
  };
}

let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

/* ================= Entrada ================= */
function showLogin(){ $('#login').hidden = false; setTimeout(() => $('#loginName').focus(), 50); }
async function login(){
  const nome = $('#loginName').value.trim().replace(/\s+/g, ' ');
  const username = norm(nome);
  if(username.length < 2){ $('#loginErr').textContent = 'Digite um nome com pelo menos 2 letras.'; return; }
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  try{
    let u = ok(await sb.from('usuarios').select('*').eq('username', username).maybeSingle());
    let isNew = false;
    if(!u){
      const res = await sb.from('usuarios').insert({username, nome}).select().single();
      if(res.error && res.error.code === '23505') u = ok(await sb.from('usuarios').select('*').eq('username', username).single());
      else { u = ok(res); isNew = true; }
    }
    state.me = u;
    try{ localStorage.setItem(ME_KEY, u.id); }catch(e){}
    await loadAll();
    $('#login').hidden = true;
    render();
    toast(isNew ? `Perfil criado. Bem-vindo, ${u.nome}!` : `Bem-vindo de volta, ${u.nome}!`);
  }catch(err){ $('#loginErr').textContent = errMsg(err); }
  $('#loginBtn').disabled = false;
}
$('#loginBtn').onclick = login;
$('#loginName').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
$('#logout').onclick = () => {
  try{ localStorage.removeItem(ME_KEY); }catch(e){}
  state.me = null; state.selected = null; state.profile = null; state.fPerson = 'todos';
  $('#loginName').value = ''; showLogin();
};

async function start(){
  if(!sb){
    $('#loginText').textContent = window.supabase
      ? 'Falta conectar o banco de dados. Abra o index.html, cole a URL e a chave do seu projeto Supabase no bloco de configuração e publique de novo. O passo a passo está no LEIAME.md.'
      : 'Não foi possível carregar as bibliotecas do app. Verifique a conexão com a internet e recarregue a página.';
    $('#loginForm').hidden = true;
    return;
  }
  let saved = null;
  try{ saved = localStorage.getItem(ME_KEY); }catch(e){}
  if(saved){
    try{
      const u = ok(await sb.from('usuarios').select('*').eq('id', saved).maybeSingle());
      if(u){ state.me = u; await loadAll(); $('#login').hidden = true; render(); return; }
    }catch(err){ $('#loginErr').textContent = errMsg(err); }
  }
  showLogin();
}
start();

// Atualiza quando você volta para a aba e a cada 2 minutos
document.addEventListener('visibilitychange', () => { if(!document.hidden && state.me && Date.now() - state.lastLoad > 30000) refresh(); });
setInterval(() => { if(!document.hidden && state.me && !dlg.open) refresh(); }, 120000);

})();
